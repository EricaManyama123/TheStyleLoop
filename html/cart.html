<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheStyleLoop | Cart</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbarstyle.css">
    <link rel="stylesheet" href="../css/footer.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">
        <a href="../index.html">TheStyleLoop</a>
    </div>

    <div class="menu">
        <div class="menu-links">
            <a href="../index.html">Home</a>
            <a href="./shop.html">Shop</a>
            <a href="./about.html">About</a>
            <a href="./contact.html">Contact</a>
            <a href="./blog.html">Blog</a>
            <a href="./cart.html"><i class="fas fa-shopping-bag"></i></a>
        </div>

        <form action="./login.html">
            <button class="log-in">Log In</button>
        </form>
    </div>
</nav>

<!-- CART SECTION -->
<section class="section-p1">

    <h2 style="text-align:center; margin-bottom:30px;">Your Cart</h2>

    <table width="100%" border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>Remove</th>
                <th>Image</th>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
            </tr>
        </thead>

        <tbody id="cartItems"></tbody>
    </table>

    <h3 style="text-align:right; margin-top:20px;">
        Total: $<span id="totalPrice">0</span>
    </h3>

</section>

<!-- FOOTER -->
<footer>
    <a href="#">TheStyleLoop</a>
    <p>© 2025 TheStyleLoop. All Rights Reserved</p>
</footer>

<!-- SCRIPT -->
<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let cartTable = document.getElementById("cartItems");
let total = 0;

function displayCart() {
    cartTable.innerHTML = "";
    total = 0;

    cart.forEach((item, index) => {

        let subtotal = item.price * item.quantity;
        total += subtotal;

        cartTable.innerHTML += `
        <tr>
            <td><button onclick="removeItem(${index})">X</button></td>
            <td><img src="${item.image}" width="70"></td>
            <td>${item.name}</td>
            <td>$${item.price}</td>
            <td>
                <input type="number" value="${item.quantity}" min="1"
                onchange="updateQuantity(${index}, this.value)">
            </td>
            <td>$${subtotal}</td>
        </tr>
        `;
    });

    document.getElementById("totalPrice").innerText = total;
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    displayCart();
}

function updateQuantity(index, qty) {
    cart[index].quantity = parseInt(qty);
    localStorage.setItem("cart", JSON.stringify(cart));
    displayCart();
}

// INITIAL LOAD
displayCart();

</script>

</body>
</html>
