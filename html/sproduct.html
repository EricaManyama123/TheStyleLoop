<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheStyleLoop | Product</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbarstyle.css">
    <link rel="stylesheet" href="../css/footer.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">
        <a href="../index.html">TheStyleLoop</a>
    </div>

    <div class="menu">
        <div class="menu-links">
            <a href="../index.html">Home</a>
            <a href="./shop.html">Shop</a>
            <a href="./about.html">About</a>
            <a href="./contact.html">Contact</a>
            <a href="./blog.html">Blog</a>
            <a href="./cart.html"><i class="fas fa-shopping-bag"></i></a>
        </div>

        <form action="./login.html">
            <button class="log-in">Log In</button>
        </form>
    </div>
</nav>

<!-- PRODUCT SECTION -->
<section id="prodetails" class="section-p1">

    <!-- IMAGE -->
    <div class="single-pro-image">
        <img id="MainImg" src="../img/products/f1.jpg" width="100%">
    </div>

    <!-- DETAILS -->
    <div class="single-pro-details">
        <h6 id="category">Home / T-Shirt</h6>
        <h4 id="productName">Men's Fashion T Shirt</h4>
        <h2 id="productPrice">$139.00</h2>

        <select>
            <option>Select Size</option>
            <option>XL</option>
            <option>XXL</option>
            <option>Small</option>
            <option>Large</option>
        </select>

        <input type="number" value="1" id="qty">

        <button class="normal" id="addToCart">Add To Cart</button>

        <h4>Product Details</h4>
        <span>
            Premium cotton fabric, breathable and stylish. Perfect for everyday wear
            with a modern elegant touch.
        </span>
    </div>

</section>

<!-- FOOTER -->
<footer>
    <a href="#">TheStyleLoop</a>

    <div class="social">
        <a href="#"><i class="fa-brands fa-facebook"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
    </div>

    <p>© 2025 TheStyleLoop. All Rights Reserved</p>
</footer>

<!-- SCRIPT -->
<script>

//////////////////////////////////////////
// 🔥 DYNAMIC PRODUCT DATA (ALL ITEMS)
//////////////////////////////////////////

const products = [
    { id: 1, name: "Floral Shirt", price: 139, image: "../img/products/f1.jpg" },
    { id: 2, name: "Green Tropical Shirt", price: 139, image: "../img/products/f2.jpg" },
    { id: 3, name: "Red Floral Shirt", price: 139, image: "../img/products/f3.jpg" },
    { id: 4, name: "White Pattern Shirt", price: 139, image: "../img/products/f4.jpg" },

    // NEW PRODUCTS
    { id: 5, name: "Blue Casual Shirt", price: 45, image: "../img/products/n1.jpg" },
    { id: 6, name: "Grey Shorts", price: 40, image: "../img/products/n2.jpg" },
    { id: 7, name: "Black Hoodie", price: 60, image: "../img/products/n3.jpg" },
    { id: 8, name: "Beige Hoodie", price: 55, image: "../img/products/n4.jpg" }

      // 🔥 ADDING YOUR MISSING ONES
    { id: 9, name: "Denim Shirt", price: 50, image: "../img/products/n5.jpg" },
    { id: 10, name: "Casual Pants", price: 65, image: "../img/products/n6.jpg" },
    { id: 11, name: "Summer Shorts", price: 35, image: "../img/products/n7.jpg" },
    { id: 12, name: "White Hoodie", price: 70, image: "../img/products/n8.jpg" }
];

//////////////////////////////////////////
// 🔥 LOAD PRODUCT FROM URL
//////////////////////////////////////////

const params = new URLSearchParams(window.location.search);
const productId = parseInt(params.get("id")) || 1;

const product = products.find(p => p.id === productId);

// SET DATA
document.getElementById("productName").innerText = product.name;
document.getElementById("productPrice").innerText = "$" + product.price;
document.getElementById("MainImg").src = product.image;

//////////////////////////////////////////
// 🔥 ADD TO CART FUNCTION
//////////////////////////////////////////

document.getElementById("addToCart").addEventListener("click", function () {

    let quantity = document.getElementById("qty").value;

    let cartItem = {
        name: product.name,
        price: product.price,
        image: product.image,
        quantity: quantity
    };

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push(cartItem);

    localStorage.setItem("cart", JSON.stringify(cart));

    alert("Added to cart ✅");

    window.location.href = "cart.html";
});

</script>

</body>
</html>
